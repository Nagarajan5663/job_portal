<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — JobPortal</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar"></div>

<section class="page">
  <div class="container">
    <div class="page-header">
      <h1>Admin Dashboard</h1>
      <p>Platform-wide statistics and management tools.</p>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div class="grid grid-4" id="stats-grid"></div>

    <div class="flex" style="gap:10px; margin:28px 0 16px;">
      <button class="btn btn-outline" id="tab-users" onclick="showTab('users')">Users</button>
      <button class="btn btn-outline" id="tab-jobs" onclick="showTab('jobs')">Jobs</button>
      <button class="btn btn-outline" id="tab-applications" onclick="showTab('applications')">Applications</button>
    </div>

    <!-- USERS TAB -->
    <div class="card" id="panel-users">
      <div class="flex-between mb-16">
        <h3 style="margin:0;">Manage Users</h3>
        <select id="role-filter" onchange="loadUsers()" style="width:auto;">
          <option value="">All Roles</option>
          <option value="jobseeker">Job Seekers</option>
          <option value="recruiter">Recruiters</option>
          <option value="admin">Admins</option>
        </select>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </div>

    <!-- JOBS TAB -->
    <div class="card hidden" id="panel-jobs">
      <h3 style="margin-top:0;">All Job Postings</h3>
      <table>
        <thead><tr><th>Title</th><th>Company</th><th>Location</th><th>Status</th><th>Posted</th><th>Actions</th></tr></thead>
        <tbody id="jobs-table-body"></tbody>
      </table>
    </div>

    <!-- APPLICATIONS TAB -->
    <div class="card hidden" id="panel-applications">
      <h3 style="margin-top:0;">All Applications</h3>
      <table>
        <thead><tr><th>Applicant</th><th>Email</th><th>Job</th><th>Status</th><th>Applied</th></tr></thead>
        <tbody id="applications-table-body"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
  Auth.requireRole("admin");
  renderNavbar("dashboard");

  async function loadStats() {
    try {
      const s = await api.dashboardStats();
      const cards = [
        ["Total Users", s.total_users],
        ["Job Seekers", s.total_jobseekers],
        ["Recruiters", s.total_recruiters],
        ["Total Jobs", s.total_jobs],
        ["Open Jobs", s.open_jobs],
        ["Total Applications", s.total_applications],
        ["Pending", s.pending_applications],
        ["Accepted", s.accepted_applications],
      ];
      document.getElementById("stats-grid").innerHTML = cards
        .map(([label, value]) => `<div class="card stat-card"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`)
        .join("");
    } catch (err) {
      showBanner("error-banner", err.message);
    }
  }

  function showTab(tab) {
    ["users", "jobs", "applications"].forEach((t) => {
      document.getElementById(`panel-${t}`).classList.toggle("hidden", t !== tab);
      document.getElementById(`tab-${t}`).className = t === tab ? "btn btn-primary" : "btn btn-outline";
    });
    if (tab === "users") loadUsers();
    if (tab === "jobs") loadJobsAdmin();
    if (tab === "applications") loadApplicationsAdmin();
  }

  async function loadUsers() {
    try {
      const role = document.getElementById("role-filter").value;
      const users = await api.listUsers(role);
      document.getElementById("users-table-body").innerHTML = users
        .map(
          (u) => `
        <tr>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td><span class="badge-role">${u.role}</span></td>
          <td><span class="status ${u.is_active ? "status-open" : "status-closed"}">${u.is_active ? "active" : "disabled"}</span></td>
          <td>${formatDate(u.created_at)}</td>
          <td>
            ${
              u.role === "admin"
                ? '<span class="text-muted">—</span>'
                : `<button class="btn btn-sm btn-outline" onclick="toggleActive(${u.id})">${u.is_active ? "Disable" : "Enable"}</button>
                   <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>`
            }
          </td>
        </tr>`
        )
        .join("");
    } catch (err) {
      showBanner("error-banner", err.message);
    }
  }

  async function toggleActive(id) {
    try {
      await api.toggleUserActive(id);
      loadUsers();
    } catch (err) {
      alert(err.message);
    }
  }

  async function deleteUser(id) {
    if (!confirm("Delete this user? This also deletes their jobs/applications.")) return;
    try {
      await api.deleteUser(id);
      loadUsers();
      loadStats();
    } catch (err) {
      alert(err.message);
    }
  }

  async function loadJobsAdmin() {
    try {
      const jobs = await api.adminListJobs();
      document.getElementById("jobs-table-body").innerHTML = jobs
        .map(
          (j) => `
        <tr>
          <td>${escapeHtml(j.title)}</td>
          <td>${escapeHtml(j.company_name || "-")}</td>
          <td>${escapeHtml(j.location || "-")}</td>
          <td><span class="status status-${j.status}">${j.status}</span></td>
          <td>${formatDate(j.created_at)}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteJobAdmin(${j.id})">Delete</button></td>
        </tr>`
        )
        .join("");
    } catch (err) {
      showBanner("error-banner", err.message);
    }
  }

  async function deleteJobAdmin(id) {
    if (!confirm("Delete this job posting?")) return;
    try {
      await api.adminDeleteJob(id);
      loadJobsAdmin();
      loadStats();
    } catch (err) {
      alert(err.message);
    }
  }

  async function loadApplicationsAdmin() {
    try {
      const apps = await api.adminListApplications();
      document.getElementById("applications-table-body").innerHTML = apps
        .map(
          (a) => `
        <tr>
          <td>${escapeHtml(a.applicant_name)}</td>
          <td>${escapeHtml(a.applicant_email)}</td>
          <td>${escapeHtml(a.job_title)}</td>
          <td><span class="status status-${a.status}">${a.status}</span></td>
          <td>${formatDate(a.applied_at)}</td>
        </tr>`
        )
        .join("");
    } catch (err) {
      showBanner("error-banner", err.message);
    }
  }

  loadStats();
  showTab("users");
</script>
</body>
</html>
